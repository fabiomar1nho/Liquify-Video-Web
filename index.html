function mkAnchors(){const pts=dabs.slice();let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;pts.forEach(p=>{mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,p[1]);mxy=Math.max(mxy,p[1])});
 const ax=(mxx-mnx)>=(mxy-mny)?0:1;pts.sort((a,b)=>a[ax]-b[ax]);const m=pts.length>>1,avg=a=>[a.reduce((s,p)=>s+p[0],0)/a.length,a.reduce((s,p)=>s+p[1],0)/a.length];
 const a1=avg(pts.slice(0,Math.max(1,m))),a2=avg(pts.slice(m)),two=Math.hypot(a2[0]-a1[0],a2[1]-a1[1])>vw*.05;
 if(!two){const c=avg(pts);return{a1:c,a2:c,two:false}}return{a1,a2,two:true}}
async function analyze(){
 if(!dabs.length){say('Pinte primeiro sobre a região a ser rastreada.');return false}
 busy=true;video.pause();H=Math.round(W*vh/vw);sc.width=W;sc.height=H;$('pg').style.display='block';
 const k=W/vw;anchors=mkAnchors();tracks=[];const n=Math.max(1,Math.round(video.duration*fps)),i0=Math.min(aFrame,n-1);
 const A=[anchors.a1.map(v=>v*k),anchors.a2.map(v=>v*k)],np=anchors.two?2:1,h=Math.max(8,Math.min(22,Math.round(radius()*k*.8)));
 const ref=await gray(i0);const T=new Array(n);T[i0]=[...anchors.a1,...anchors.a2];
 for(const dir of[1,-1]){let prev=ref,P=A.map(a=>a.slice()),V=[[0,0],[0,0]];
  for(let i=i0+dir;i>=0&&i<n;i+=dir){const cur=await gray(i);const out=[];
   for(let q=0;q<np;q++){let m=match(prev,cur,P[q],h,10,[P[q][0]+V[q][0],P[q][1]+V[q][1]]);let np_=m.p;
    const r=match(ref,cur,A[q],h,4,np_);if(r.err<14&&m.err<30)np_=[(np_[0]+r.p[0])/2,(np_[1]+r.p[1])/2];
    V[q]=[(np_[0]-P[q][0])*.6,(np_[1]-P[q][1])*.6];P[q]=np_;out.push(np_[0]/k,np_[1]/k)}
   if(np===1)out.push(out[0],out[1]);T[i]=out;prev=cur;
   if(i%3===0){$('pg').firstChild.style.width=((dir>0?(i-i0):(n-i0+i0-i))/n*100)+'%';say(`Rastreando quadro ${i}/${n}…`)}}}
 const S=T.map((t,i)=>{let a=[0,0,0,0],c=0;for(let j=i-2;j<=i+2;j++)if(T[j]){for(let z=0;z<4;z++)a[z]+=T[j][z];c++}return a.map(v=>v/c)});
 tracks=S;busy=false;$('pg').style.display='none';await seek((i0+.5)/fps);
 say(`Rastreamento concluído (${np===2?'2 pontos: posição, rotação e escala':'1 ponto: posição'}). Reproduza para conferir.`);return true}
$('trk').onclick=()=>{if(loaded&&!busy&&!isImg)analyze()};
// ---------- Export (frame a frame, WebCodecs + mp4-muxer) ----------
let expCancel=false,srcFile=null;
const fmtS=s=>s>=60?Math.floor(s/60)+'min '+Math.round(s%60)+'s':Math.max(1,Math.round(s))+'s';
function eprog(p,t,sub){p=Math.max(0,Math.min(100,p));$('ob').style.width=p+'%';$('op').textContent=Math.floor(p)+'%';if(t)$('ot').textContent=t;$('os').textContent=sub||''}
$('ocan').onclick=()=>{expCancel=true;$('ot').textContent='Cancelando…'};
const even=v=>Math.max(2,Math.round(v/2)*2);
$('exp').onclick=async()=>{
 if(!loaded||busy)return;
 if(isImg){await exportImage();return}
 if(dabs.length&&!tracks.length&&!await analyze())return;
 busy=true;expCancel=false;video.pause();$('ov').style.display='flex';eprog(0,'Preparando exportação…');
 const ow=cv.width,oh=cv.height,t0=Date.now();let ew=vw,eh=vh;
 if($('cap').value==='1080'){const m=Math.max(vw,vh);if(m>1920){ew=vw*1920/m;eh=vh*1920/m}}
 cv.width=even(ew);cv.height=even(eh);
 try{const ok=window.VideoEncoder&&window.VideoFrame&&window.Mp4Muxer;
  const res=ok?await expFrames(cv.width,cv.height,t0):await expRealtime(t0);
  if(res&&!expCancel){eprog(100,'Concluído. Salvando arquivo…');await save(res)}else say('Exportação cancelada.')
 }catch(e){console.error(e);say('Falha na exportação: '+(e.message||e))}
 cv.width=ow;cv.height=oh;$('ov').style.display='none';busy=false;video.muted=false;await seek(.001)};
async function save(r){const fn=r.ext==='png'?'imagem-editada.':'video-editado.';
 try{const d=window.claude&&await claude.use('downloads');
  if(d)await d.save({filename:fn+r.ext,data:r.blob});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=fn+r.ext;a.click()}
  say(`Exportado (${r.ext.toUpperCase()}${r.note||''}).`)}catch(e){say('Arquivo gerado, mas o salvamento foi cancelado ou falhou.')}}
async function exportImage(){busy=true;const ow=cv.width,oh=cv.height;let ew=vw,eh=vh;
 if($('cap').value==='1080'){const m=Math.max(vw,vh);if(m>1920){ew=Math.round(vw*1920/m);eh=Math.round(vh*1920/m)}}
 cv.width=ew;cv.height=eh;draw();const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
 cv.width=ow;cv.height=oh;busy=false;if(!blob){say('Falha ao gerar a imagem.');return}await save({blob,ext:'png'})}
async function expFrames(w,h,t0){
 const n=Math.max(1,Math.round(video.duration*fps));let codec=null;
 const bitrate=Math.round(Math.min(40e6,Math.max(6e6,w*h*fps*.12)));
 for(const c of[['avc','avc1.640033'],['avc','avc1.64002A'],['vp9','vp09.00.51.08']]){
  try{const s=await VideoEncoder.isConfigSupported({codec:c[1],width:w,height:h,bitrate,framerate:fps});if(s.supported){codec=c;break}}catch(e){}}
 if(!codec)return expRealtime(t0);
 let abuf=null,audioOK=false,note='';
 try{if(srcFile){eprog(0,'Decodificando áudio original…');const ac=new AudioContext();abuf=await ac.decodeAudioData(await srcFile.arrayBuffer());ac.close()}}catch(e){abuf=null}
 const ach=abuf?Math.min(2,abuf.numberOfChannels):0;
 if(abuf&&window.AudioEncoder){try{audioOK=(await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:abuf.sampleRate,numberOfChannels:ach,bitrate:160000})).supported}catch(e){}}
 if(!audioOK)note=', sem áudio';
 const target=new Mp4Muxer.ArrayBufferTarget();
 const mux=new Mp4Muxer.Muxer({target,video:{codec:codec[0],width:w,height:h,frameRate:fps},...(audioOK?{audio:{codec:'aac',sampleRate:abuf.sampleRate,numberOfChannels:ach}}:{}),fastStart:'in-memory',firstTimestampBehavior:'offset'});
 let err=null;
 if(audioOK){eprog(0,'Codificando áudio…');
  const ae=new AudioEncoder({output:(c,m)=>mux.addAudioChunk(c,m),error:e=>err=e});
  ae.configure({codec:'mp4a.40.2',sampleRate:abuf.sampleRate,numberOfChannels:ach,bitrate:160000});
  const sr=abuf.sampleRate;
  for(let o=0;o<abuf.length;o+=sr){const len=Math.min(sr,abuf.length-o),d=new Float32Array(len*ach);
   for(let c=0;c<ach;c++)d.set(abuf.getChannelData(c).subarray(o,o+len),c*len);
   ae.encode(new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:len,numberOfChannels:ach,timestamp:Math.round(o/sr*1e6),data:d}))}
  await ae.flush();ae.close()}
 const ve=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>err=e});
 ve.configure({codec:codec[1],width:w,height:h,bitrate,framerate:fps});
 for(let i=0;i<n;i++){
  if(err)throw err;if(expCancel){ve.close();return null}
  await seek((i+.5)/fps);draw();
  const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
  ve.encode(f,{keyFrame:i%Math.max(1,Math.round(fps))===0});f.close();
  while(ve.encodeQueueSize>6)await new Promise(r=>setTimeout(r,4));
  const el=(Date.now()-t0)/1000;eprog(Math.min(99,(i+1)/n*100),`Processando frame ${i+1} de ${n}…`,`Faltam ~${fmtS(el/(i+1)*(n-i-1))}`)}
 eprog(99,'Finalizando arquivo MP4…','');await ve.flush();ve.close();if(err)throw err;mux.finalize();
 return{blob:new Blob([target.buffer],{type:'video/mp4'}),ext:'mp4',note}}
async function expRealtime(t0){
 await seek(0);const cs=cv.captureStream(fps),vs=video.captureStream?video.captureStream():null;
 if(vs)vs.getAudioTracks().forEach(t=>cs.addTrack(t));
 const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
 const rec=new MediaRecorder(cs,{mimeType:mt,videoBitsPerSecond:16e6}),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 const fin=new Promise(r=>rec.onstop=r),n=Math.round(video.duration*fps);video.muted=false;video.playbackRate=1;
 const tick=setInterval(()=>{if(expCancel)video.pause();eprog(video.currentTime/video.duration*100,`Gravando em tempo real (frame ${Math.min(n,fidx())} de ${n})…`,'Modo alternativo: sem exportação quadro a quadro neste navegador.')},250);
 rec.start(250);await video.play();
 await new Promise(r=>{video.addEventListener('ended',r,{once:true});video.addEventListener('pause',r,{once:true})});
 await new Promise(r=>setTimeout(r,300));eprog(99,'Finalizando arquivo '+(mt.includes('mp4')?'MP4':'WebM')+'…');rec.stop();await fin;clearInterval(tick);
 if(expCancel)return null;return{blob:new Blob(ch,{type:mt.split(';')[0]}),ext:mt.includes('mp4')?'mp4':'webm'}}
// ---------- Loop ----------
function drawOv(){const c=$('ovc'),r=$('stage').getBoundingClientRect(),d=devicePixelRatio||1,w=Math.round(r.width*d),h=Math.round(r.height*d);
 if(c.width!==w||c.height!==h){c.width=w;c.height=h}
 const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);
 if(!showTrk||!loaded||isImg||!anchors||!tracks.length)return;
 const v=view(),X=p=>v.ox+p*v.sc,Y=p=>v.oy+p*v.sc,n=tracks.length,ci=Math.min(Math.max(fidx(),0),n-1),np=anchors.two?2:1,col=['#22d3ee','#f472b6'];
 x.lineJoin='round';x.lineCap='round';
 for(let q=0;q<np;q++){
  const path=(a,b)=>{x.beginPath();let on=false;for(let i=a;i<=b;i++){const t=tracks[i];if(!t){on=false;continue}const px=X(t[q*2]),py=Y(t[q*2+1]);if(!on){x.moveTo(px,py);on=true}else x.lineTo(px,py)}x.stroke()};
  x.strokeStyle=col[q];x.globalAlpha=.35;x.lineWidth=2;path(0,n-1);x.globalAlpha=1;x.lineWidth=3;path(0,ci)}
 const t=tracks[ci]||tracks.find(Boolean);if(!t)return;
 if(anchors.two){x.strokeStyle='#fff';x.globalAlpha=.6;x.setLineDash([5,5]);x.lineWidth=1.5;x.beginPath();x.moveTo(X(t[0]),Y(t[1]));x.lineTo(X(t[2]),Y(t[3]));x.stroke();x.setLineDash([])}
 x.globalAlpha=1;
 for(let q=0;q<np;q++){const px=X(t[q*2]),py=Y(t[q*2+1]);
  x.strokeStyle=col[q];x.lineWidth=1.5;x.beginPath();x.moveTo(px-16,py);x.lineTo(px+16,py);x.moveTo(px,py-16);x.lineTo(px,py+16);x.stroke();
  x.fillStyle=col[q];x.strokeStyle='#fff';x.lineWidth=2.5;x.beginPath();x.arc(px,py,8,0,7);x.fill();x.stroke();
  x.fillStyle='#000';x.font='bold 10px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(String(q+1),px,py+.5)}}
(function loop(){draw();drawOv();ui();requestAnimationFrame(loop)})();btn();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}}
</script></body></html>
